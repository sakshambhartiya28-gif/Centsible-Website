<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Gold coin body -->
  <circle cx="100" cy="105" r="62" fill="#F5C518"/>
  <circle cx="100" cy="105" r="55" fill="#E8B400"/>
  <circle cx="100" cy="105" r="50" fill="#F5C518"/>

  <!-- Inner ring -->
  <circle cx="100" cy="105" r="44" fill="none" stroke="#D4A017" stroke-width="2"/>

  <!-- Cent symbol -->
  <text x="100" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1a5c3a">¢</text>

  <!-- Arrow path curving around bottom-right -->
  <path d="M 148 130 Q 170 90 148 58" stroke="#1a5c3a" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Arrow head -->
  <polygon points="144,50 158,60 148,72" fill="#1a5c3a"/>

  <!-- CENTSIBLE text curved on top arc -->
  <defs>
    <path id="topArc" d="M 22,95 A 78,78 0 0,1 178,95"/>
  </defs>
  <text font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#1a5c3a" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CENTSIBLE</textPath>
  </text>
</svg>
